<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="css/clock-style.css">
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        <p class="subtitle">Current Time in Different Time Zones</p>
        
        <div class="clock-grid" id="clock-grid">
            <!-- Clocks will be generated by JavaScript -->
        </div>
        
        <div class="controls">
            <button class="btn-add" onclick="addTimeZone()">+ Add Time Zone</button>
            <button class="btn-reset" onclick="resetClocks()">Reset</button>
        </div>
        
        <div class="modal" id="timezone-modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2>Select Time Zone</h2>
                <select id="timezone-select" class="timezone-select">
                    <!-- Options will be generated by JavaScript -->
                </select>
                <button class="btn-confirm" onclick="confirmTimezone()">Add</button>
            </div>
        </div>
    </div>

    <script src="js/clock.js"></script>
</body>
</html>
