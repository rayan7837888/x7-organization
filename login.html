<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - X7</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <span class="logo-icon">⚔️</span>
                <h1>X7</h1>
                <p>منظمة سيبرانية</p>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="auth-form active">
                <h2>تسجيل الدخول</h2>
                
                <div class="form-group">
                    <label for="login-email">البريد الإلكتروني</label>
                    <input type="email" id="login-email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label for="login-password">كلمة المرور</label>
                    <input type="password" id="login-password" placeholder="أدخل كلمة المرور" required>
                </div>

                <button class="auth-button" onclick="loginUser()">دخول</button>

                <p class="auth-toggle">
                    لا تملك حساباً؟ 
                    <a href="#" onclick="toggleForms()">أنشئ حساباً جديداً</a>
                </p>

                <div id="login-error" class="error-message"></div>
                <div id="login-success" class="success-message"></div>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="auth-form">
                <h2>إنشاء حساب جديد</h2>

                <div class="form-group">
                    <label for="register-username">اسم المستخدم</label>
                    <input type="text" id="register-username" placeholder="اختر اسم مستخدم" required>
                </div>

                <div class="form-group">
                    <label for="register-email">البريد الإلكتروني</label>
                    <input type="email" id="register-email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label for="register-password">كلمة المرور</label>
                    <input type="password" id="register-password" placeholder="اختر كلمة مرور قوية" required>
                </div>

                <div class="form-group">
                    <label for="register-password-confirm">تأكيد كلمة المرور</label>
                    <input type="password" id="register-password-confirm" placeholder="أعد كتابة كلمة المرور" required>
                </div>

                <button class="auth-button" onclick="registerUser()">إنشاء حساب</button>

                <p class="auth-toggle">
                    هل لديك حساب بالفعل؟ 
                    <a href="#" onclick="toggleForms()">تسجيل الدخول</a>
                </p>

                <div id="register-error" class="error-message"></div>
                <div id="register-success" class="success-message"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
